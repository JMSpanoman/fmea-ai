services:
  # Backend Service
  - type: web
    name: fmea-backend
    env: docker
    dockerfilePath: ./Dockerfile.backend
    dockerContext: .
    plan: starter
    region: oregon
    branch: main
    healthCheckPath: /health
    envVars:
      - key: ENVIRONMENT
        value: production
      - key: CORS_ORIGINS
        value: https://fmea-frontend.onrender.com,https://fmea-ai-frontend.onrender.com
      - key: DATABASE_URL
        value: sqlite:////app/db/fmea.db
      - key: SECRET_KEY
        generateValue: true
      - key: OPENAI_API_KEY
        sync: false  # Set this in Render dashboard
      # Render starter instances are memory-constrained; keep concurrency low to avoid OOM.
      - key: WEB_CONCURRENCY
        value: "1"
      - key: GUNICORN_TIMEOUT
        value: "120"
      # Optional: enable /auth/dev-login for demos in production. If enabled, set an allowlist.
      - key: ALLOW_DEV_LOGIN
        value: "true"
      - key: DEV_LOGIN_ALLOWED_EMAILS
        value: "john@fotonconsulting.com"  # Expand later as needed (comma-separated)
      - key: PORT
        value: 8000

  # Frontend Service
  - type: web
    name: fmea-frontend
    env: docker
    dockerfilePath: ./Dockerfile.frontend
    dockerContext: .
    plan: starter
    region: oregon
    branch: main
    envVars:
      - key: VITE_API_BASE_URL
        value: https://fmea-backend.onrender.com
      - key: BACKEND_URL
        value: https://fmea-backend.onrender.com
      - key: NODE_ENV
        value: production
      - key: PORT
        value: 80
