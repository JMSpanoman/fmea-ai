services:
  - type: web
    name: fmea-backend
    runtime: docker
    dockerfilePath: ./Dockerfile.backend
    dockerContext: .
    plan: starter
    region: oregon
    branch: main
    autoDeployTrigger: "off"
    healthCheckPath: /health
    envVars:
      - key: ENVIRONMENT
        value: production
      - key: CORS_ORIGINS
        value: https://fmea-frontend-dczh.onrender.com,https://fmea-frontend.onrender.com,https://fmea-ai-frontend.onrender.com,https://demo.smartrisk.com
      - key: DATABASE_URL
        value: sqlite:////app/db/fmea.db
      - key: JWT_SECRET_KEY
        generateValue: true
      - key: SECRET_KEY
        generateValue: true
      - key: OPENAI_API_KEY
        sync: false
      - key: WEB_CONCURRENCY
        value: "1"
      - key: GUNICORN_TIMEOUT
        value: "120"
      - key: ALLOW_DEV_LOGIN
        sync: false
      - key: DEV_LOGIN_ALLOWED_EMAILS
        sync: false
      - key: DEMO_ENSURE_PROJECT
        value: "false"
      - key: DEMO_REASSIGN_PROJECT
        value: "false"
      - key: DEMO_PROJECT_ID
        sync: false
      - key: DEMO_USER_EMAIL
        sync: false
      # These settings are managed in Render during the staged production cutover.
      # Blueprint sync must not replace credentials or change rollout gates.
      - key: AUTH0_DOMAIN
        sync: false
      - key: API_AUDIENCE
        sync: false
      - key: SR1_FRONTEND_ORIGIN
        sync: false
      - key: ENABLE_SELF_SERVICE_TRIALS
        sync: false
      - key: ENABLE_SR1_BILLING
        sync: false
      - key: ENABLE_LIVE_BILLING
        sync: false
      - key: STRIPE_RESTRICTED_KEY
        sync: false
      - key: STRIPE_WEBHOOK_SECRET
        sync: false
      - key: STRIPE_PRICE_MONTHLY
        sync: false
      - key: STRIPE_PRICE_YEARLY
        sync: false
      - key: STRIPE_PORTAL_CONFIGURATION
        sync: false
      - key: PORT
        value: "8000"

  - type: web
    name: fmea-frontend
    runtime: docker
    dockerfilePath: ./Dockerfile.frontend
    dockerContext: .
    plan: starter
    region: oregon
    branch: main
    autoDeployTrigger: "off"
    healthCheckPath: /health
    envVars:
      - key: BACKEND_URL
        value: https://fmea-backend-dczh.onrender.com
      - key: NODE_ENV
        value: production
      - key: VITE_AUTH0_DOMAIN
        sync: false
      - key: VITE_AUTH0_CLIENT_ID
        sync: false
      - key: VITE_AUTH0_AUDIENCE
        sync: false
      - key: PORT
        value: "80"
