services:
  - type: web
    name: fmea-backend
    env: docker
    dockerfilePath: ./Dockerfile.backend
    dockerContext: .
    plan: starter
    region: oregon
    branch: main
    healthCheckPath: /health
    disk:
      name: fmea-sqlite
      mountPath: /app/db
      sizeGB: 1
    envVars:
      - key: ENVIRONMENT
        value: production
      - key: CORS_ORIGINS
        value: https://fmea-frontend.onrender.com,https://fmea-ai-frontend.onrender.com,https://demo.smartrisk.com
      - key: DATABASE_URL
        value: sqlite:////app/db/fmea.db
      - key: JWT_SECRET_KEY
        generateValue: true
      - key: SECRET_KEY
        generateValue: true
      - key: OPENAI_API_KEY
        sync: false
      - key: WEB_CONCURRENCY
        value: "1"
      - key: GUNICORN_TIMEOUT
        value: "120"
      - key: ALLOW_DEV_LOGIN
        value: "true"
      - key: DEV_LOGIN_ALLOWED_EMAILS
        value: "gridmatrix@gridmatrix.com,john@fotonconsulting.com"
      - key: DEMO_ENSURE_PROJECT
        value: "true"
      - key: DEMO_REASSIGN_PROJECT
        value: "true"
      - key: DEMO_PROJECT_ID
        value: "cd214464-e10b-488a-86dc-f24022508b60"
      - key: DEMO_USER_EMAIL
        value: "gridmatrix@gridmatrix.com"
      - key: PORT
        value: "8000"

  - type: web
    name: fmea-frontend
    env: docker
    dockerfilePath: ./Dockerfile.frontend
    dockerContext: .
    plan: starter
    region: oregon
    branch: main
    healthCheckPath: /health
    envVars:
      - key: BACKEND_URL
        value: https://fmea-backend.onrender.com
      - key: NODE_ENV
        value: production
      - key: PORT
        value: "80"
