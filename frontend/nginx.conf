server {
    listen ${PORT};
    server_name localhost;
    root /usr/share/nginx/html;
    index index.html;

    # Handle client-side routing
    location / {
        try_files $uri $uri/ /index.html;
    }

    # API proxy to backend (using environment variable)
    location /api/ {
        proxy_pass ${BACKEND_URL}/;
        # When proxying to an HTTPS upstream (Render), ensure SNI is enabled and
        # send the correct Host header for the upstream domain.
        proxy_ssl_server_name on;
        proxy_set_header Host $proxy_host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header X-Forwarded-Host $host;
    }

    # Health check endpoint
    # Keep frontend health independent of backend availability to avoid Render marking
    # this service unhealthy (which can cause global 502s).
    location = /health {
        add_header Content-Type application/json;
        return 200 '{"status":"healthy","service":"frontend"}';
    }

    # Static files caching
    location ~* \.(js|css|png|jpg|jpeg|gif|ico|svg)$ {
        expires 1y;
        add_header Cache-Control "public, immutable";
    }
}
